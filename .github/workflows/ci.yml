name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Primary gate: typecheck, lint and the full vitest suite (unit + integration,
  # including the in-process dev SSH server) on Linux.
  check:
    name: Check (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Test (unit + integration)
        run: pnpm test

  # Build the Electron bundles and run Playwright e2e under Xvfb. The e2e spec
  # directory is owned by the Lead; until it exists this job builds and then
  # skips the Playwright step with a notice (it is not silently green).
  e2e:
    name: Build + e2e (ubuntu-latest, xvfb)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app
        run: pnpm build

      - name: Install Electron system libraries and Xvfb
        run: |
          sudo apt-get update
          # ubuntu-latest (24.04) renamed some libraries with the t64 suffix;
          # fall back to the pre-t64 names on older images.
          sudo apt-get install -y --no-install-recommends \
            xvfb libnss3 libgbm1 libxss1 libxtst6 libgtk-3-0t64 libasound2t64 \
            || sudo apt-get install -y --no-install-recommends \
              xvfb libnss3 libgbm1 libxss1 libxtst6 libgtk-3-0 libasound2

      - name: Run Playwright e2e (skips until tests/e2e exists)
        run: |
          if [ -d tests/e2e ] && find tests/e2e -maxdepth 1 -name '*.spec.ts' -print -quit | grep -q .; then
            xvfb-run -a pnpm test:e2e
          else
            echo "::notice title=e2e-skipped::tests/e2e has no specs yet (Lead owns e2e); skipping Playwright."
          fi

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
          if-no-files-found: ignore

  # Catch Windows/macOS-specific breakage (local file backend paths, node-pty
  # prebuilds, native module loading, config store paths).
  test-other-os:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - windows-latest
          - macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm 11
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Test
        shell: bash
        run: |
          set +e
          pnpm test 2>&1 | tee vitest-output.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            {
              echo "### Vitest failure on ${{ matrix.os }}"
              echo '```'
              tail -n 150 vitest-output.log
              echo '```'
            } >> "$GITHUB_STEP_SUMMARY"
            # Surface the actual failing assertions, not just the last lines.
            grep -E 'FAIL|AssertionError|Error:|expected|Unhandled|failed|✗|×' vitest-output.log \
              | tail -n 60 > vitest-failures.log || true
            if [ -s vitest-failures.log ]; then
              while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                echo "::error title=Vitest::$clean"
              done < vitest-failures.log
            else
              tail -n 40 vitest-output.log | while IFS= read -r line; do
                clean=$(printf '%s' "$line" | tr -d '\r' | sed 's/%/%25/g')
                echo "::error title=Vitest::$clean"
              done
            fi
          fi
          exit "$status"
